# LiteLLM config.yaml에 붙여 넣을 부분 (model_list 등과 같은 높이). 시크릿은 os.environ/이름 - 값은 mcp.env
# 대화에서 가끔만 쓰는 2개만. tautulli·plex·bookoasis·docker_bookoasis는 봇이 직접 띄운다 (서버 운영에서 몇 분마다 부르는데
# LiteLLM은 세션마다 여기 있는 stdio 서버를 전부 새로 띄워서 무거웠다). config.yaml에 다른 MCP 서버(예: mcp-server-time)가 있으면
# 그것도 세션마다 같이 뜨니 안 쓰면 지운다.
mcp_servers:
  youtube:
    transport: "stdio"
    command: "uvx"
    args: ["--from", "yt-mcp-server", "youtube-mcp-server"]
  korea_weather:
    transport: "stdio"
    command: "uvx"
    args: ["--with", "httpx", "--with", "mcp<2", "korea-weather-mcp@latest"]
    env:
      PUBLIC_DATA_API_SECRET: "os.environ/PUBLIC_DATA_API_SECRET"
