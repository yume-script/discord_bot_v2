# MultiServerMCPClient가 부팅 시 1회 읽어 연결한다 (ai/mcp_manager.py).
# 서버를 추가/제거할 때 코드 수정 없이 이 파일만 바꾸면 된다.
#
# - 시크릿(API 키/토큰)은 여기 직접 적지 말고 "${변수명}"으로 쓰고 실제 값은 .env에 둔다
#   (이 파일은 git에 커밋된다). .env에 변수가 없으면 그 서버만 건너뛴다.
# - admin_only: true - 그 서버의 도구를 전부 관리자(ADMIN_DISCORD_IDS)만 실행할 수 있다.
#   이름만으로는 조회처럼 보여도(read_file, list_containers 등) 민감한 정보에 닿는 서버에 쓴다.

youtube:
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--from"
    - "yt-mcp-server"
    - "youtube-mcp-server"

minecraft_bds:
  transport: stdio
  command: /mnt/discord_bot_v2/venv/bin/python3
  args:
    - "/mnt/discord_bot_v2/scripts/bds_mcp.py"
  env:
    BDS_CONTAINER: "mc-be-server"
    BDS_ALLOWED_COMMANDS: "list,version,help,allowlist list,whitelist list"

# /mnt 전체(각 프로젝트의 .env, 백업 포함)를 읽을 수 있어서 관리자 전용
filesystem:
  admin_only: true
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-filesystem"
    - "/mnt"
  env:
    HOME: "/root"
    PATH: "/root/.nvm/versions/node/v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# 컨테이너 목록/로그/환경변수 조회만으로도 내부 정보가 드러나서 관리자 전용
docker_local:
  admin_only: true
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "mcp<2"
    - "mcp-server-docker"

# 컨테이너 목록/로그/환경변수 조회만으로도 내부 정보가 드러나서 관리자 전용
docker_bookoasis:
  admin_only: true
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "mcp<2"
    - "mcp-server-docker"
  env:
    DOCKER_HOST: "ssh://192.168.0.31"

tautulli:
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "mcp<2"
    - "mcp-tautulli"
  env:
    TAUTULLI_URL: "http://192.168.0.31:8181"
    TAUTULLI_API_KEY: "${TAUTULLI_API_KEY}"

server_status:
  transport: stdio
  command: /mnt/poring_food/venv/bin/python3
  args:
    - "/mnt/discord_bot_v2/scripts/server_status_mcp.py"

bookoasis:
  transport: stdio
  command: ssh
  args:
    - "-i"
    - "/root/.ssh/id_ed25519_bookoasis"
    - "-o"
    - "BatchMode=yes"
    - "root@192.168.0.31"
    - "docker"
    - "exec"
    - "-i"
    - "bookoasis"
    - "python3"
    - "/app/tools/mcp_server.py"

poring_food:
  transport: stdio
  command: /mnt/poring_food/venv/bin/python3
  args:
    - "/mnt/poring_food/mcp_server.py"

plex:
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/node
  args:
    - "/mnt/plex-mcp-server/build/plex-mcp-server.js"
  env:
    PLEX_URL: "http://192.168.0.31:32400"
    PLEX_TOKEN: "${PLEX_TOKEN}"

korea_weather:
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "httpx"
    - "--with"
    - "mcp<2"
    - "korea-weather-mcp@latest"
  env:
    PUBLIC_DATA_API_SECRET: "${PUBLIC_DATA_API_SECRET}"

# 모든 카톡방/디스코드 채널의 대화 로그가 한 DB에 있어서 관리자 전용
sqlite:
  admin_only: true
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/npx
  args:
    - "-y"
    - "mcp-server-sqlite-npx"
    - "/mnt/discord_bot_v2/storage/conversations.db"
  env:
    HOME: "/root"
    PATH: "/root/.nvm/versions/node/v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

memory:
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-memory"
  env:
    MEMORY_FILE_PATH: "/mnt/discord_bot_v2/storage/mcp_memory.json"
    HOME: "/root"
    PATH: "/root/.nvm/versions/node/v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

