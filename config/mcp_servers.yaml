# MultiServerMCPClient가 부팅 시 1회 읽어 연결한다 (ai/mcp_manager.py).
# 서버를 추가/제거할 때 코드 수정 없이 이 파일만 바꾸면 된다.
#
# - 시크릿(API 키/토큰)은 여기 직접 적지 말고 "${변수명}"으로 쓰고 실제 값은 .env에 둔다
#   (이 파일은 git에 커밋된다). .env에 변수가 없으면 그 서버만 건너뛴다.
# - admin_only: true - 그 서버의 도구를 전부 관리자(ADMIN_DISCORD_IDS)만 실행할 수 있다.
#   이름만으로는 조회처럼 보여도(read_file, list_containers 등) 민감한 정보에 닿는 서버에 쓴다.

# /mnt 전체(각 프로젝트의 .env, 백업 포함)를 읽을 수 있어서 관리자 전용
filesystem:
  admin_only: true
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-filesystem"
    - "/mnt"
  env:
    HOME: "/root"
    PATH: "/root/.nvm/versions/node/v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# 컨테이너 목록/로그/환경변수 조회만으로도 내부 정보가 드러나서 관리자 전용
docker_local:
  admin_only: true
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "mcp<2"
    - "mcp-server-docker"

# scripts/server_status_mcp.py 주석대로 mcp 1.30이 확인된 이 봇의 venv로 실행한다
# (poring_food venv에서는 도구 로드가 확인되지 않았음).
server_status:
  transport: stdio
  command: /mnt/discord_bot_v2/venv/bin/python3
  args:
    - "/mnt/discord_bot_v2/scripts/server_status_mcp.py"

# LiteLLM 프록시 전체 + 이 봇이 직접 센 LLM 요청 수/토큰 (읽기 전용, 키는 응답에 안 나간다)
# 포링푸드 담당 실적(에린 '연산 처리'/'운영 경비')과 "오늘 LLM 몇 번 썼어?" 질문에 쓴다.
llm_usage:
  transport: stdio
  command: /mnt/discord_bot_v2/venv/bin/python3
  args:
    - "/mnt/discord_bot_v2/scripts/llm_usage_mcp.py"
  env:
    LITELLM_BASE_URL: "${LITELLM_BASE_URL}"
    LITELLM_API_KEY: "${LITELLM_API_KEY}"

# 모든 카톡방/디스코드 채널의 대화 로그가 한 DB에 있어서 관리자 전용
sqlite:
  admin_only: true
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/npx
  args:
    - "-y"
    - "mcp-server-sqlite-npx"
    - "/mnt/discord_bot_v2/storage/conversations.db"
  env:
    HOME: "/root"
    PATH: "/root/.nvm/versions/node/v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

memory:
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-memory"
  env:
    MEMORY_FILE_PATH: "/mnt/discord_bot_v2/storage/mcp_memory.json"
    HOME: "/root"
    PATH: "/root/.nvm/versions/node/v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# ── 서버 운영에 쓰는 서버 - 봇이 직접 (LiteLLM 게이트웨이에서 되돌림) ──
# LiteLLM 게이트웨이는 세션마다 거기 있는 stdio 서버를 전부 새로 띄워서(세션 하나에 프로세스 10여 개) 몇 분마다 묻는
# 서버 조절·모니터링에는 무거웠다. 봇이 직접 띄우고, 자주 부르는 것(MCP_PERSISTENT - 기본 이 넷)은 세션을 열어 두고 다시 쓴다.

# 컨테이너 목록/로그/환경변수 조회만으로도 내부 정보가 드러나서 관리자 전용
docker_bookoasis:
  admin_only: true
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "mcp<2"
    - "mcp-server-docker"
  env:
    DOCKER_HOST: "ssh://192.168.0.31"

tautulli:
  transport: stdio
  command: /root/.local/bin/uvx
  args:
    - "--with"
    - "mcp<2"
    - "mcp-tautulli"
  env:
    TAUTULLI_URL: "http://192.168.0.31:8181"
    TAUTULLI_API_KEY: "${TAUTULLI_API_KEY}"

bookoasis:
  transport: stdio
  command: ssh
  args:
    - "-i"
    - "/root/.ssh/id_ed25519_bookoasis"
    - "-o"
    - "BatchMode=yes"
    - "root@192.168.0.31"
    - "docker"
    - "exec"
    - "-i"
    - "bookoasis"
    - "python3"
    - "/app/tools/mcp_server.py"

plex:
  transport: stdio
  command: /root/.nvm/versions/node/v24.18.0/bin/node
  args:
    - "/mnt/plex-mcp-server/build/plex-mcp-server.js"
  env:
    PLEX_URL: "http://192.168.0.31:32400"
    PLEX_TOKEN: "${PLEX_TOKEN}"

# ── LiteLLM MCP 게이트웨이 (deploy/litellm/README.md) ──
# 대화에서 가끔만 쓰는 youtube·korea_weather만 LiteLLM이 대신 띄운다.
# 도구 이름은 LiteLLM이 붙인 앞머리("plex-")를 떼고 원래 이름으로 쓰고, admin_only_servers의 도구는 관리자 전용.
# .env: LITELLM_BASE_URL·LITELLM_API_KEY (봇이 이미 쓰는 값 - 그 키에 MCP 서버를 쓸 권한이 있어야 한다)
#
litellm:
  transport: streamable_http
  url: "${LITELLM_BASE_URL}/mcp/"
  headers:
    x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
    # 이 봇이 쓰는 서버만 (LiteLLM에 다른 MCP 서버도 있으면 도구 목록을 줄 때 그것까지 다 띄워 봐서 느리다)
    x-mcp-servers: "youtube,korea_weather"
  gateway_servers: [youtube, korea_weather]
