# 오아시스 마을 마인크래프트 (Java) - 인물(LLM 에이전트)들이 봇으로 접속해 마을을 짓고 몬스터를 잡는다.
#   cd /mnt/discord_bot_v2/scripts/minecraft && docker compose up -d --build
# 봇(poring_food/minecraft.py)은 agents 서비스의 HTTP API(127.0.0.1:3010)로만 일을 시킨다.
# 아무도 없으면 서버가 1분 뒤 스스로 멈춘다(PAUSE_WHEN_EMPTY_SECONDS) - 결계 단계가 높거나 영상 재생이 버벅이면
# 봇이 모두 나가므로 그때는 CPU를 거의 쓰지 않는다. 사람이 구경하려면 25565 포트로 접속 (ONLINE_MODE=FALSE라
# 아무 이름으로나 들어올 수 있으니 공유기에서 이 포트를 바깥에 열지 말 것 - 집 안에서만).
services:
  mc-village:
    image: itzg/minecraft-server:latest
    container_name: mc-village
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.4"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"          # 봇은 마이크로소프트 계정이 없다
      DIFFICULTY: "easy"
      MODE: "survival"
      MOTD: "Oasis Village"
      LEVEL: "oasis"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "10"
      SPAWN_PROTECTION: "0"
      PAUSE_WHEN_EMPTY_SECONDS: "60"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-change-me}"
      OPS: "${MC_OPS:-Aesun,Benimaru,Shuna,Stark,Fern,Kazuma,Souei,Gabiru,Ubel,Elaina}"
      TZ: "Asia/Seoul"
      # 웹 지도 (BlueMap) - 브라우저로 http://<서버>:8100 에서 개척지를 3D로 본다. 처음 한 번 core.conf의
      # accept-download를 true로 바꿔야 그리기 시작한다 (README / scripts/minecraft/bluemap-setup.sh)
      # 베드락(모바일/콘솔/윈10) 유저도 같이 - GeyserMC(베드락 프로토콜 변환) + Floodgate(Xbox 계정으로 접속, 자바 정품 불필요).
      # Geyser/Floodgate는 Modrinth에 베타판만 있거나 1.21.4 파일이 없어서 GeyserMC 공식 다운로드 주소로 받는다.
      # Geyser 최신판은 최신 자바 판 프로토콜만 말하므로, 서버(1.21.4)와 이어 주는 ViaVersion을 같이 넣는다.
      MODRINTH_PROJECTS: "bluemap,viaversion"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    ports:
      - "25565:25565"
      - "8100:8100"               # BlueMap 웹 지도 (집 안에서만 - 공유기에서 열지 말 것)
      # 베드락 접속 (Geyser, 기본 포트 19132/udp) - 베드락 유저는 서버 주소만 넣으면 된다(기본 포트). 바깥에 열 거라면
      # 이 UDP 포트만 연다 (베드락 유저는 Floodgate가 Xbox 계정으로 확인한다. 25565는 온라인 인증이 꺼져 있어 누구나
      # OP 봇 이름으로 들어올 수 있으니 절대 바깥에 열지 말 것)
      - "19132:19132/udp"
      # 새 베드락(1.26.x)은 Geyser의 '접속 신호(signaling)'를 같은 번호의 TCP(HTTP)로 먼저 찾는다 - UDP만 열면
      # InitialConnection 오류(Terracotta)로 못 들어온다. 바깥에 열 때도 TCP/UDP 19132 둘 다 연다.
      - "19132:19132/tcp"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  mc-agents:
    build: ./agents
    container_name: mc-agents
    restart: unless-stopped
    depends_on: [mc-village]
    environment:
      MC_HOST: mc-village
      MC_PORT: "25565"
      MC_VERSION: "1.21.4"
      API_PORT: "3010"
      VILLAGE_X: "${MC_VILLAGE_X:-0}"
      VILLAGE_Z: "${MC_VILLAGE_Z:-0}"
    ports:
      - "127.0.0.1:3010:3010"       # 봇(같은 서버)만 부른다
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
