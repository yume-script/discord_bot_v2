<!-- 좋은 글귀와 배경 이미지를 보여주는 홈 위젯입니다. -->
<section class="gq-quote" data-background="gradient" aria-label="좋은 글귀" hidden>
  <img class="gq-quote-background" data-quote-image alt="" aria-hidden="true" hidden>
  <div class="gq-quote-content">
    <p class="gq-quote-eyebrow">A MOMENT BETWEEN PAGES <span>좋은 글귀</span></p>
    <div class="gq-quote-reading">
      <div class="gq-quote-reading-inner">
        <div class="gq-quote-words" aria-live="polite" aria-atomic="true">
          <blockquote data-quote-en lang="en"></blockquote>
          <p data-quote-ko lang="ko"></p>
        </div>
        <p class="gq-quote-author" data-quote-author></p>
      </div>
    </div>
  </div>
  <div class="gq-quote-footer">
    <p class="gq-quote-status" data-quote-status role="status"></p>
    <div class="gq-quote-controls">
      <small class="gq-quote-translation" data-quote-translation hidden></small>
      <button type="button" data-quote-next aria-label="다른 글귀" title="다른 글귀"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button>
      <button type="button" data-quote-language aria-label="글귀 언어 전환">En.한</button>
      <button type="button" data-quote-background aria-label="배경 변경" title="배경 변경"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
      <div class="gq-quote-sources" data-open="false">
        <button type="button" data-quote-source-toggle aria-label="출처 보기" aria-haspopup="dialog" aria-expanded="false" aria-controls="gq-quote-source-info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></button>
        <div id="gq-quote-source-info" data-quote-sources role="dialog" aria-label="출처 정보" hidden></div>
      </div>
    </div>
  </div>
</section>
